# Dong bo Firestore `events` -> BigQuery moi 15 phut.
# GitHub cron la BEST-EFFORT (co the tre vai phut) va bi tat sau 60 ngay repo khong hoat dong.
# Cach cai secrets: docs/BIGQUERY_SETUP.md muc 7.
name: sync-bigquery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill toan bo events (idempotent, ton read Firestore)'
        type: boolean
        default: false

# Khong chay chong nhau. MERGE van an toan neu chong, nhung dung phi read.
concurrency:
  group: sync-bigquery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_CLIENT_EMAIL: ${{ secrets.BIGQUERY_CLIENT_EMAIL }}
          BIGQUERY_PRIVATE_KEY: ${{ secrets.BIGQUERY_PRIVATE_KEY }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
          BIGQUERY_EVENTS_TABLE: ${{ vars.BIGQUERY_EVENTS_TABLE }}
          BIGQUERY_LOCATION: ${{ vars.BIGQUERY_LOCATION }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            node scripts/bigquery/sync-events.js --backfill
          else
            node scripts/bigquery/sync-events.js
          fi
